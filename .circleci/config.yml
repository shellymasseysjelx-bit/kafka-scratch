version: 2.1

jobs:
  bundle_dec27-ship:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Freeze working set
          command: |
            mkdir -p /tmp/pipeline
            { set +o pipefail 2>/dev/null; yes "x$RANDOM" | head -n 186515 | md5sum; true ; } > /tmp/pipeline/full_task_output.log
            echo "gate dec27-ship: $(wc -c </tmp/pipeline/full_task_output.log) bytes total"
      - persist_to_workspace:
          root: /tmp/pipeline
          paths:
            - full_task_output.log
  dec27-ship:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/pipeline
      - run:
          name: Verify previous
          command: |
            cat /tmp/pipeline/full_task_output.log
      - run:
          name: Fetch project tree
          command: git clone --depth 3 --single-branch --filter=tree:0 https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Extract archive
          command: tar --extract --xz --file=core-pkg.tar.xz
      - run:
          command: env | wc -l
      - run:
          name: Post-build check
          command: free -m
      - run:
          command: cmake --version
      - run:
          no_output_timeout: 111m
          command: exec ./handler
  precheck_hu-ship:
